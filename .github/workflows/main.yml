name: Daily edition

# Rebuilds the edition every morning and commits it. If this repo is connected
# to Vercel, the push triggers an automatic redeploy of the live site.

on:
  schedule:
    - cron: "0 6 * * *"      # 06:00 UTC daily — adjust to taste
  workflow_dispatch: {}        # lets you run it manually from the Actions tab

permissions:
  contents: write              # needed to commit the regenerated files

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # WeasyPrint needs Pango/Cairo at runtime for PDF rendering.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi-dev libcairo2 fonts-dejavu-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build today's edition (HTML + PDF + email digest)
        run: python it_news_agent.py --out . --pdf --summary

      - name: Commit if anything changed
        run: |
          git config user.name  "bitstream-bot"
          git config user.email "bitstream-bot@users.noreply.github.com"
          git add index.html latest.html editions/
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "Daily edition: $(date -u +%Y-%m-%d)"
            git push
          fi
